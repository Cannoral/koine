<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разбор текстов</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/app.css" rel="stylesheet">
<script src="../assets/theme.js"></script>
</head>
<body class="bg-body-tertiary">

<nav class="navbar bg-body border-bottom sticky-top">
  <div class="container-lg">
    <a class="navbar-brand mb-0 h1 fs-6 text-decoration-none" href="../index.html">← Темы</a>
    <span class="fw-semibold text-truncate ms-2">Разбор текстов</span>
    <button id="themeToggle" class="btn btn-sm btn-outline-secondary ms-2" type="button" aria-label="Сменить тему">🌗</button>
  </div>
</nav>

<main class="container-lg py-3 py-md-4" style="max-width: 46rem;">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0">Тексты</h1>
    <a class="btn btn-primary btn-sm" href="text.html?edit=new">Создать</a>
  </div>
  <p id="empty" class="text-secondary d-none">Текстов пока нет. Они хранятся только в этом браузере.</p>
  <div class="list-group shadow-sm" id="list"></div>
</main>

<script src="../assets/texts.js"></script>
<script>
const list = document.getElementById('list');
function render() {
  const texts = Texts.all();
  document.getElementById('empty').classList.toggle('d-none', texts.length > 0);
  list.innerHTML = '';
  texts.forEach(t => {
    const row = document.createElement('div');
    row.className = 'list-group-item d-flex align-items-center gap-2';
    row.innerHTML =
      '<a class="greek flex-grow-1 text-truncate text-decoration-none" href="text.html?id=' + t.id + '"></a>' +
      '<a class="btn btn-sm btn-outline-secondary" href="text.html?edit=' + t.id + '">Редактировать</a>' +
      '<button class="btn btn-sm btn-outline-danger" type="button">Удалить</button>';
    row.querySelector('a').textContent = Texts.title(t);
    row.querySelector('button').onclick = () => {
      if (confirm('Удалить «' + Texts.title(t) + '»?')) { Texts.remove(t.id); render(); }
    };
    list.appendChild(row);
  });
}
render();
</script>
</body>
</html>
