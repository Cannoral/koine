<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text parsing</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/app.css" rel="stylesheet">
<script src="../assets/theme.js"></script>
<style>
  :root { --accent: #1F2A5C; --on-accent: #fff; --sel: #E8ECF6; }
  [data-bs-theme="dark"] { --accent: #A9B8F0; --on-accent: #10142A; --sel: #262E4A; }
  .greek { line-height: 1.3; }
  .muted { color: var(--bs-secondary-color); }
  .lbl { font-size: 12px; font-weight: 600; color: var(--bs-secondary-color); }
  .panel { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 16px; overflow: hidden; }
  .panel-head { background: var(--bs-tertiary-bg); border-bottom: 1px solid var(--bs-border-color); }

  /* Syntactic role: the Russian school underlining convention, each role its own colour. */
  [data-role="subject"]   { --c: #1D5FD1; --deco: solid; }
  [data-role="predicate"] { --c: #C2410C; --deco: double; }
  [data-role="object"]    { --c: #0E7C6B; --deco: dashed; }
  [data-role="attribute"] { --c: #7C3AED; --deco: wavy; }
  [data-role="adverbial"] { --c: #A16207; }
  [data-bs-theme="dark"] [data-role="subject"]   { --c: #7AA7F5; }
  [data-bs-theme="dark"] [data-role="predicate"] { --c: #F0915C; }
  [data-bs-theme="dark"] [data-role="object"]    { --c: #4CC2AE; }
  [data-bs-theme="dark"] [data-role="attribute"] { --c: #B794F6; }
  [data-bs-theme="dark"] [data-role="adverbial"] { --c: #E0B04A; }
  [data-role] .w {
    text-decoration: underline var(--deco) var(--c); text-decoration-thickness: 2px;
    text-underline-offset: .25em; text-decoration-skip-ink: none;
  }
  [data-role="predicate"] .w, [data-role="attribute"] .w { text-decoration-thickness: 1.5px; }
  /* No dash-dot in text-decoration-style — draw it as a gradient under the word. */
  [data-role="adverbial"] .w {
    text-decoration: none; padding-bottom: 2px;
    background: repeating-linear-gradient(90deg, var(--c) 0 9px, transparent 9px 12px,
                var(--c) 12px 14px, transparent 14px 17px) 0 100% / 100% 2px no-repeat;
  }
  .sample { display: inline-block; width: 30px; height: 14px; white-space: pre; font-size: 12px; line-height: 14px; }
  [data-role] .sample { text-underline-offset: 3px; }

  /* Toggle buttons. Pressed: filled accent; a role chip pressed: tinted in its colour. */
  .chip {
    display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px;
    border: 1px solid var(--bs-border-color); border-radius: 8px; background: var(--bs-body-bg);
    color: var(--bs-body-color); font-size: 13px; font-weight: 500;
  }
  .chip:hover { background: var(--bs-secondary-bg); }
  .chip.ghost { background: transparent; border-color: transparent; }
  .chip.ghost:hover { background: var(--bs-secondary-bg); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip.ghost[aria-pressed="true"] { background: var(--bs-body-bg); border-color: var(--bs-border-color); color: var(--bs-body-color); }
  .chip[data-role][aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, transparent); border-color: var(--c); color: var(--c); }
  .btn-accent { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn-accent:hover { opacity: .9; }
  .icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--bs-body-color); }
  .icon-btn:hover { background: var(--bs-secondary-bg); }
  .form-switch .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
  .chip:focus-visible, .word:focus-visible, .icon-btn:focus-visible, .btn-accent:focus-visible, .grow:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* The text: numbered sentences, each a row of word buttons with the comment under the word. */
  .sent { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }
  .sent-no { padding-top: 12px; font-size: 15px; text-align: right; color: var(--bs-secondary-color); }
  .toks { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 4px; row-gap: 14px; }
  .word {
    display: inline-flex; flex-direction: column; align-items: flex-start; gap: 6px;
    padding: 6px 7px 8px; border: 0; border-radius: 10px; background: none; color: inherit; text-align: left;
    transition: background-color .12s, opacity .12s;
  }
  .word:hover { background: var(--bs-secondary-bg); }
  .word[aria-pressed="true"] { background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .word.dim { opacity: .28; }
  .word .tw { font-size: 28px; line-height: 1.3; }
  .word .note { max-width: 168px; font-size: 12.5px; line-height: 1.35; color: var(--c, var(--bs-secondary-color)); }
  .hide-notes .note { display: none; }

  .side { flex: 1 1 340px; min-width: 0; position: sticky; top: 72px; }
  .tag { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 6px; background: var(--bs-secondary-bg); font-size: 13px; }
  .role-pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; background: var(--bs-secondary-bg); color: var(--bs-secondary-color); }
  .role-pill[data-role] { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .side fieldset { display: flex; flex-direction: column; gap: 8px; }
  .side legend { font-size: 12px; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: 0; }

  .grid5 { display: grid; grid-template-columns: 1.1fr 1.5fr 1.3fr 1.2fr 1.4fr; gap: 16px; align-items: center; }
  .grow { width: 100%; min-height: 52px; padding: 8px 20px; border: 0; border-bottom: 1px solid var(--bs-border-color-translucent); background: transparent; color: inherit; text-align: left; }
  .grow:hover { background: var(--bs-tertiary-bg); }
  .grow[aria-pressed="true"] { background: var(--sel); }
  .grow [data-role] .w { text-underline-offset: 5px; }

  /* PDF = the browser's print dialog, "Save as PDF". Text stays text, fonts and underlines as on screen. */
  /* Any author margin box on an edge hides Chrome's default header/footer on that edge
     (Chrome 131+): date and title at the top, URL at the bottom. Page number kept, our own. */
  @page {
    margin: 15mm;
    @top-center { content: ""; }
    @bottom-right { content: counter(page) " / " counter(pages); font: 9pt sans-serif; color: #666; }
  }
  @media print {
    nav, .no-print, .side { display: none !important; }
    body { background: none !important; }
    main { max-width: none !important; padding: 0 !important; }
    .panel { border: 0; }
    .word[aria-pressed="true"] { background: none; box-shadow: none; }
    .word.dim { opacity: 1; }
    .grow { break-inside: avoid; }
    .grow[aria-pressed="true"] { background: none; }
    .w { print-color-adjust: exact; -webkit-print-color-adjust: exact; }   /* keeps the dash-dot gradient */
  }
</style>
</head>
<body class="bg-body-tertiary">

<nav class="navbar bg-body border-bottom sticky-top">
  <div class="container-xl gap-2">
    <div class="d-flex align-items-center gap-2 min-w-0">
      <a class="btn btn-link fw-medium text-decoration-none px-1" href="texts.html">← Texts</a>
      <span class="muted" aria-hidden="true">/</span>
      <span class="muted text-truncate">Text parsing</span>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a id="btnEdit" class="btn btn-sm btn-outline-secondary d-none" href="#">Edit text</a>
      <button id="btnPdf" class="btn btn-sm btn-outline-secondary d-none" type="button">Export PDF</button>
      <button id="themeToggle" class="btn btn-sm btn-outline-secondary" type="button" aria-label="Toggle theme">🌗</button>
    </div>
  </div>
</nav>

<main class="container-xl py-3 py-md-4">

  <!-- ?edit=new or ?edit=<id> -->
  <form id="form" class="d-none mx-auto" style="max-width: 46rem;">
    <label for="body" class="form-label">Text</label>
    <textarea id="body" class="form-control greek fs-5 mb-3" rows="12" required></textarea>
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-link text-secondary" href="texts.html">Cancel</a>
  </form>

  <!-- ?id=<id> -->
  <section id="view" class="d-none">
    <div class="d-flex flex-wrap gap-4 align-items-start mb-4">
      <section aria-label="Text" class="panel" style="flex: 999 1 600px; min-width: 0;">
        <div class="panel-head d-flex flex-wrap align-items-center justify-content-between gap-2 py-2 pe-4" style="padding-left: 64px;">
          <div id="legend" role="group" aria-label="Sentence parts" class="d-flex flex-wrap align-items-center gap-1"></div>
          <div class="form-check form-switch mb-0 no-print small fw-medium">
            <input class="form-check-input" type="checkbox" role="switch" id="notesSw" checked>
            <label class="form-check-label" for="notesSw">Comments</label>
          </div>
        </div>
        <div id="text" class="d-flex flex-column gap-4 p-4"></div>
      </section>
      <aside id="side" aria-label="Word parse" class="panel side"></aside>
    </div>

    <section aria-label="Parsed words" class="panel">
      <h2 class="h6 fw-semibold m-0 px-3 py-3 border-bottom">Parsed words</h2>
      <p id="noParses" class="muted small m-0 p-3">Nothing parsed yet.</p>
      <div style="overflow-x: auto;">
        <div id="parses" style="min-width: 820px;"></div>
      </div>
    </section>
  </section>

  <p id="missing" class="text-secondary d-none">Text not found. <a href="texts.html">Back to list</a></p>
</main>

<script src="../assets/texts.js"></script>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const edit = q.get('edit'), id = q.get('id');
const show = el => $(el).classList.remove('d-none');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cap = s => s[0].toUpperCase() + s.slice(1);

// Features and their values.
const F = {
  vform:  ['Form',       ['finite', 'participle', 'infinitive']],
  tense:  ['Tense',      ['pres.', 'impf.', 'fut.', 'aor.', 'perf.', 'plpf.']],
  mood:   ['Mood',       ['ind.', 'subj.', 'opt.', 'impv.']],
  voice:  ['Voice',      ['act.', 'mid.', 'pass.', 'mid./pass.']],
  person: ['Person',     ['1st', '2nd', '3rd']],
  case:   ['Case',       ['Nom.', 'Gen.', 'Dat.', 'Acc.', 'Voc.']],
  number: ['Number',     ['sg.', 'pl.']],
  gender: ['Gender',     ['masc.', 'fem.', 'neut.']],
  gov:    ['Governs',    ['+ Gen.', '+ Dat.', '+ Acc.']],
};
// Features asked for each part of speech; for a verb, also for each form.
const POS = {
  noun:        ['case', 'number', 'gender'],
  adjective:   ['case', 'number', 'gender'],
  article:     ['case', 'number', 'gender'],
  pronoun:     ['person', 'case', 'number', 'gender'],
  verb:        ['vform'],
  adverb: [], preposition: ['gov'], conjunction: [], particle: [],
};
const VFORM = {
  finite:     ['tense', 'mood', 'voice', 'person', 'number'],
  participle: ['tense', 'voice', 'case', 'number', 'gender'],
  infinitive: ['tense', 'voice'],
};
const keys = p => (POS[p.pos] || []).concat(p.pos === 'verb' && VFORM[p.vform] || []);
// A participle or infinitive is named as such; the verb's form is not repeated among the tags.
const posName = p => p.pos === 'verb' && p.vform && p.vform !== 'finite' ? p.vform : p.pos;
const tags = p => keys(p).filter(k => k !== 'vform').map(k => p[k]).filter(Boolean);
const ROLES = ['subject', 'predicate', 'object', 'attribute', 'adverbial'];
const NB = ' '.repeat(8);   // the underline sample is drawn under blank space
const roleAttr = r => r ? ' data-role="' + r + '"' : '';
const sample = '<span class="w sample" aria-hidden="true">' + NB + '</span>';

if (edit) {
  const t = edit === 'new' ? null : Texts.get(edit);
  if (edit !== 'new' && !t) show('missing');
  else {
    show('form');
    if (t) $('body').value = t.body;
    $('form').onsubmit = e => {
      e.preventDefault();
      location.href = 'text.html?id=' + Texts.put(t && t.id, $('body').value);
    };
  }
} else if (!Texts.get(id)) show('missing');
else {
  show('view'); show('btnEdit'); show('btnPdf');
  $('btnEdit').href = 'text.html?edit=' + id;
  document.title = Texts.title(Texts.get(id));   // the PDF's default file name
  $('btnPdf').onclick = () => print();
  // Print in the light theme whatever is on screen; Ctrl+P goes through here too.
  let theme;
  addEventListener('beforeprint', () => { theme = document.documentElement.dataset.bsTheme; document.documentElement.dataset.bsTheme = 'light'; });
  addEventListener('afterprint', () => { document.documentElement.dataset.bsTheme = theme; });

  // A word: letters with diacritics, optionally an elision apostrophe (δι’).
  const WORD = /[\p{L}\p{M}]+[’ʼ']?/gu;
  // sel — the word in the side panel; cur — the parse being edited (null = not editing);
  // focus — the role the legend highlights.
  let words = [], sel = 0, cur = null, focus = null;

  // ponytail: a parse is tied to the word's position; after the text is edited, parses whose
  // word changed are simply hidden. Re-anchor them by word if that ever matters.
  const parsed = (t, i) => t.parses && t.parses[i] && t.parses[i].w === words[i] ? t.parses[i] : null;

  // Words with the punctuation around them, grouped by sentence. Sentences end at . ; ; ! ? —
  // the ano teleia (·) is a colon, not an end. Line breaks of the source are not kept.
  function tokenize(body) {
    const toks = [...body.matchAll(WORD)].map(m => ({ w: m[0], at: m.index, pre: '', punct: '' }));
    toks.forEach((t, i) => {
      const end = t.at + t.w.length, next = toks[i + 1];
      const gap = body.slice(end, next ? next.at : body.length).split(/\s+/);
      t.punct = gap[0];
      if (next && gap.length > 1) next.pre = gap[gap.length - 1];
    });
    if (toks.length) toks[0].pre = body.slice(0, toks[0].at).trim();
    const sents = [...body.matchAll(/[^.;;!?]+[.;;!?]*/g)].map(m => m.index + m[0].length);
    const out = [];
    toks.forEach((t, i) => {
      t.i = i;
      const s = sents.findIndex(b => t.at < b);
      if (!out.length || out[out.length - 1].s !== s) out.push({ s, toks: [] });
      out[out.length - 1].toks.push(t);
    });
    return out;
  }

  function render() {
    const t = Texts.get(id), sents = tokenize(t.body);
    words = sents.flatMap(s => s.toks.map(x => x.w));
    sel = Math.min(sel, Math.max(words.length - 1, 0));

    $('legend').innerHTML =
      '<button type="button" class="chip ghost" data-act="focus" data-v="" aria-pressed="' + !focus + '">All</button>' +
      ROLES.map(r => '<button type="button" class="chip ghost"' + roleAttr(r) + ' data-act="focus" data-v="' + r +
                     '" aria-pressed="' + (focus === r) + '">' + sample + cap(r) + '</button>').join('');

    $('text').innerHTML = sents.map((s, n) =>
      '<div class="sent"><span class="sent-no greek">' + (n + 1) + '</span><div class="toks">' +
      s.toks.map(x => {
        const p = parsed(t, x.i) || {};
        return '<button type="button" class="word' + (focus && p.role !== focus ? ' dim' : '') + '"' + roleAttr(p.role) +
          ' data-act="sel" data-i="' + x.i + '" aria-pressed="' + (x.i === sel) + '">' +
          '<span class="tw greek">' + esc(x.pre) + '<span class="w">' + esc(x.w) + '</span>' + esc(x.punct) + '</span>' +
          (p.note ? '<span class="note">' + esc(p.note) + '</span>' : '') + '</button>';
      }).join('') + '</div></div>').join('');

    const rows = words.map((w, i) => [w, i, parsed(t, i)]).filter(r => r[2] && r[2].pos);
    $('noParses').classList.toggle('d-none', rows.length > 0);
    $('parses').innerHTML = rows.length ? '<div class="grid5 lbl px-3 py-2 border-bottom panel-head">' +
      '<span>Form</span><span>Morphology</span><span>Dictionary form</span><span>Translation</span><span>Comment</span></div>' +
      rows.map(([w, i, p]) =>
        '<button type="button" class="grow grid5" data-act="sel" data-i="' + i + '" aria-pressed="' + (i === sel) + '">' +
        '<span class="greek fs-5"' + roleAttr(p.role) + '><span class="w">' + esc(w) + '</span></span>' +
        '<span class="small"><span class="muted">' + esc(posName(p)) + '</span> ' + esc(tags(p).join(' ')) + '</span>' +
        '<span class="greek" style="font-size: 17px">' + esc(p.lemma) + '</span>' +
        '<span>' + esc(p.gloss || '—') + '</span>' +
        '<span class="small muted">' + esc(p.note) + '</span></button>').join('') : '';

    renderSide(t);
  }

  function renderSide(t) {
    if (!words.length) { $('side').innerHTML = ''; return; }
    const p = parsed(t, sel), w = esc(words[sel]);
    let html = '<div class="panel-head d-flex align-items-center justify-content-between gap-2 py-2 pe-2 ps-3">' +
      '<span class="lbl text-uppercase" style="letter-spacing: .06em">' + (cur ? 'Edit parse' : 'Word ' + (sel + 1) + ' of ' + words.length) + '</span>' +
      '<div class="d-flex gap-1"><button type="button" class="icon-btn" data-act="go" data-v="-1" aria-label="Previous word">‹</button>' +
      '<button type="button" class="icon-btn" data-act="go" data-v="1" aria-label="Next word">›</button></div></div>';

    if (cur) {
      const chips = (label, k, opts, role) => '<fieldset><legend>' + label + '</legend><div class="d-flex flex-wrap gap-1">' +
        opts.map(o => '<button type="button" class="chip"' + (role ? roleAttr(o) : '') + ' data-act="pick" data-k="' + k +
          '" data-v="' + o + '" aria-pressed="' + (cur[k] === o) + '">' + (role ? sample + cap(o) : o) + '</button>').join('') +
        '</div></fieldset>';
      html += '<form id="parseForm" class="d-flex flex-column gap-3 p-3">' +
        '<span class="greek" style="font-size: 34px">' + w + '</span>' +
        chips('Part of speech', 'pos', Object.keys(POS)) +
        keys(cur).map(k => chips(F[k][0], k, F[k][1])).join('') +
        '<div class="d-grid gap-2" style="grid-template-columns: repeat(2, minmax(0, 1fr))">' +
        '<label class="lbl d-flex flex-column gap-1">Dictionary form<input data-k="lemma" class="form-control greek" autocomplete="off" placeholder="λόγος, -ου, ὁ" value="' + esc(cur.lemma) + '"></label>' +
        '<label class="lbl d-flex flex-column gap-1">Translation<input data-k="gloss" class="form-control" autocomplete="off" value="' + esc(cur.gloss) + '"></label></div>' +
        chips('Syntax role', 'role', ROLES, true) +
        '<label class="lbl d-flex flex-column gap-1">Comment<textarea data-k="note" class="form-control" rows="2">' + esc(cur.note) + '</textarea></label>' +
        '<div class="d-flex flex-wrap align-items-center gap-2"><button type="submit" class="btn-accent">Save</button>' +
        '<button type="button" class="btn btn-outline-secondary" style="min-height: 44px" data-act="cancel">Cancel</button>' +
        (p ? '<button type="button" class="btn btn-link link-danger text-decoration-none ms-auto" data-act="del">Remove parse</button>' : '') +
        '</div></form>';
    } else if (p) {
      html += '<div class="d-flex flex-column gap-3 p-3">' +
        '<div class="d-flex flex-column gap-1"><span class="greek" style="font-size: 40px">' + w + '</span>' +
        (p.lemma ? '<span class="greek" style="font-size: 19px">' + esc(p.lemma) + '</span>' : '') +
        '<span class="muted">' + (p.gloss ? '— ' + esc(p.gloss) : 'no translation') + '</span></div>' +
        (p.pos ? '<div class="d-flex flex-wrap gap-1"><span class="tag fw-medium">' + esc(posName(p)) + '</span>' +
          tags(p).map(x => '<span class="tag">' + esc(x) + '</span>').join('') + '</div>' : '') +
        '<div class="d-flex flex-column gap-1"><span class="lbl">Syntax role</span><span class="role-pill"' + roleAttr(p.role) + '>' +
          (p.role ? sample + cap(p.role) : 'None') + '</span></div>' +
        (p.note ? '<div class="d-flex flex-column gap-1"><span class="lbl">Comment</span>' +
          '<p class="m-0 px-3 py-2 rounded-3 bg-body-tertiary">' + esc(p.note) + '</p></div>' : '') +
        '<div class="d-flex flex-wrap align-items-center gap-2"><button type="button" class="btn-accent" data-act="edit">Edit parse</button>' +
        '<span class="small muted">or click another word</span></div></div>';
    } else {
      html += '<div class="d-flex flex-column gap-3 p-3"><span class="greek" style="font-size: 40px">' + w + '</span>' +
        '<p class="m-0 muted">This word isn’t parsed yet.</p>' +
        '<button type="button" class="btn-accent align-self-start" data-act="edit">Parse word</button></div>';
    }
    $('side').innerHTML = html;
    if (cur) $('parseForm').onsubmit = save;
  }

  function save(e) {
    e.preventDefault();
    const p = { w: words[sel] };
    ['pos', 'role'].concat(keys(cur)).forEach(k => { if (cur[k]) p[k] = cur[k]; });   // stale features dropped
    ['lemma', 'gloss', 'note'].forEach(k => { const v = (cur[k] || '').trim(); if (v) p[k] = v; });
    done(Object.keys(p).length > 1 ? p : null);   // nothing filled in = no parse
  }
  function done(p) { Texts.parse(id, sel, p); cur = null; render(); }

  const act = {
    sel:    b => { sel = +b.dataset.i; cur = null; render(); },
    go:     b => { sel = (sel + +b.dataset.v + words.length) % words.length; cur = null; render(); },
    focus:  b => { focus = b.dataset.v === focus ? null : b.dataset.v || null; render(); },
    edit:   () => { cur = Object.assign({}, parsed(Texts.get(id), sel)); renderSide(Texts.get(id)); },
    cancel: () => { cur = null; renderSide(Texts.get(id)); },
    del:    () => done(null),
    pick:   b => { const k = b.dataset.k; cur[k] = cur[k] === b.dataset.v ? undefined : b.dataset.v; renderSide(Texts.get(id)); },
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act[b.dataset.act](b); });
  // Typed fields go straight into the draft, so a chip click redrawing the form keeps them.
  $('side').addEventListener('input', e => { if (cur && e.target.dataset.k) cur[e.target.dataset.k] = e.target.value; });
  $('notesSw').onchange = e => $('text').classList.toggle('hide-notes', !e.target.checked);
  render();
}
</script>
</body>
</html>
