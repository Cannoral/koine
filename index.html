<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр грамматики койне</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<script src="assets/theme.js"></script>
</head>
<body class="bg-body-tertiary">

<nav class="navbar bg-body border-bottom sticky-top">
  <div class="container-lg">
    <span class="navbar-brand mb-0 h1 fs-5">
      <span class="greek">Κοινή</span> · тренажёр грамматики
    </span>
    <button id="themeToggle" class="btn btn-sm btn-outline-secondary" type="button" aria-label="Сменить тему">🌗</button>
  </div>
</nav>

<main class="container-lg py-3 py-md-4" style="max-width: 46rem;">

  <p class="text-secondary small mb-3">
    Уроки 1–24: настоящее время всех залогов, три склонения, причастия, инфинитив.
    Выберите тему для тренировки.
  </p>

  <!-- Имя -->
  <h2 class="h6 text-uppercase text-secondary fw-semibold mt-4 mb-2 ps-1">Имя</h2>
  <div class="list-group shadow-sm" id="group-noun"></div>

  <!-- Глагол -->
  <h2 class="h6 text-uppercase text-secondary fw-semibold mt-4 mb-2 ps-1">Глагол</h2>
  <div class="list-group shadow-sm" id="group-verb"></div>

  <!-- Служебные части речи -->
  <h2 class="h6 text-uppercase text-secondary fw-semibold mt-4 mb-2 ps-1">Служебные слова</h2>
  <div class="list-group shadow-sm" id="group-misc"></div>

  <!-- Итоговый разбор -->
  <h2 class="h6 text-uppercase text-secondary fw-semibold mt-4 mb-2 ps-1">Итог</h2>
  <div class="list-group shadow-sm" id="group-final"></div>

  <p class="text-secondary small mt-4 mb-0">
    Материал по урокам 25–50 (аорист, будущее, перфект, сослагательное) пока не разбирается.
  </p>
</main>

<script>
const TOPICS = [
  { g:'misc', file:'pages/article.html',            title:'Артикли',                           sub:'ὁ, ἡ, τό — все роды, числа и падежи',   lessons:'уроки 2, 5–6' },
  { g:'noun', file:'pages/nouns-1.html',            title:'Существительные I склонения',       sub:'-η, -ᾱ, -ᾰ, -ης, -ᾱς',                  lessons:'уроки 2–3' },
  { g:'noun', file:'pages/nouns-2.html',            title:'Существительные II склонения',      sub:'-ος (м.р.), -ον (ср.р.)',               lessons:'уроки 5–6' },
  { g:'noun', file:'pages/nouns-3.html',            title:'Существительные III склонения',     sub:'согласные основы, -μα/-ματ-, -ις, -ευς', lessons:'уроки 12–13' },
  { g:'noun', file:'pages/nouns-all.html',          title:'Существительные всех склонений',    sub:'смешанно; тип определяем по Gen. sing.', lessons:'уроки 2–13' },
  { g:'noun', file:'pages/adjectives.html',         title:'Прилагательные',                    sub:'ἀγαθός, -ή, -όν; согласование с именем', lessons:'урок 7' },
  { g:'noun', file:'pages/adjective-position.html', title:'Позиция прилагательного',           sub:'атрибутивная / предикативная',          lessons:'урок 7' },
  { g:'noun', file:'pages/pronouns.html',           title:'Личные и указательные местоимения', sub:'ἐγώ, σύ, αὐτός; οὗτος, ἐκεῖνος',        lessons:'уроки 4, 22' },
  { g:'verb', file:'pages/eimi.html',               title:'Глагол εἰμί (быть)',                sub:'praesens ind., все шесть лиц',          lessons:'урок 4' },
  { g:'verb', file:'pages/verbs-active.html',       title:'Глаголы: активный залог',           sub:'I–III спряжение, слитные, на -μι',      lessons:'уроки 9–11, 14–15' },
  { g:'verb', file:'pages/verbs-midpass.html',      title:'Средний / пассивный залог',         sub:'-ομαι, -ῃ, -εται…; агент ὑπό + Gen.',   lessons:'уроки 17–18, 21' },
  { g:'verb', file:'pages/participles.html',        title:'Причастия',                         sub:'λύων, λύουσα, λῦον; λυόμενος',          lessons:'уроки 19–20' },
  { g:'verb', file:'pages/infinitive.html',         title:'Инфинитив',                         sub:'λύειν, λύεσθαι; Acc. cum inf.',         lessons:'урок 22' },
  { g:'misc', file:'pages/prepositions.html',       title:'Предлоги',                          sub:'управление падежами',                   lessons:'уроки 3, 5, 23' },
  { g:'final', file:'pages/homoforms.html',         title:'Омоформы',                          sub:'λύουσι(ν), λύεται, λύῃ, -ας, -ος, -εως', lessons:'уроки 2–24' },
];

const chevron = '<svg class="bi-chev" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';

TOPICS.forEach((t, i) => {
  const el = document.createElement('a');
  el.href = t.file;
  el.className = 'list-group-item list-group-item-action topic-link';
  el.innerHTML =
    '<span class="topic-num">' + (i + 1) + '</span>' +
    '<span class="topic-body">' +
      '<span class="d-block topic-title">' + t.title + '</span>' +
      '<span class="d-block topic-sub text-truncate">' + t.sub + ' · ' + t.lessons + '</span>' +
    '</span>' + chevron;
  document.getElementById('group-' + t.g).appendChild(el);
});

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
